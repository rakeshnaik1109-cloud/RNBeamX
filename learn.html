<script>
(function () {
  // shared paint servers (gradients, glow filters) that the drawings refer to, as in the editor
  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  defs.setAttribute('width', '0'); defs.setAttribute('height', '0'); defs.setAttribute('aria-hidden', 'true'); defs.style.position = 'absolute';
  defs.innerHTML = '<defs>' + RNBX.renderDefs() + '</defs>';
  document.body.prepend(defs);
  RNBX.learn.mount(document.getElementById('learnRoot'), { editor: window.RNBX_EDITOR_URL || 'index.html' });
  // bright / dark switch: remembered, and shared with the app and the guide
  var root = document.documentElement, btns = document.querySelectorAll('[data-set-theme]');
  var current = function () { var t = root.getAttribute('data-theme'); return t || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); };
  var show = function () { var c = current(); btns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-set-theme') === c ? 'true' : 'false'); }); };
  btns.forEach(function (b) { b.addEventListener('click', function () { var t = b.getAttribute('data-set-theme'); root.setAttribute('data-theme', t); try { localStorage.setItem('rnbx_theme', JSON.stringify(t)); } catch (e) {} show(); }); });
  show();
})();
</script>
